name: Build Goa Deals & Food APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          unzip -q "$ZIP_FILE" -d project
          ROOT=$(find project -type f -name settings.gradle -print -quit | xargs dirname)
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Android project root: $ROOT"

      - name: Build Debug APK
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Goa-Deals-Food-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
